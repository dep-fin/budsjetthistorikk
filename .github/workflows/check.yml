name: Python-kontroller
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Parser versions
        run: python -c "from lxml import etree; print('lxml', etree.LXML_VERSION, 'libxml2 runtime', etree.LIBXML_VERSION, 'compiled', etree.LIBXML_COMPILED_VERSION)"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m pytest -vv --durations=20
